<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Deepseek HARNESS Quant · 因子</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/v2/assets/ui_common.css">
<link rel="stylesheet" href="/v2/assets/anim_common.css">
<link rel="stylesheet" href="/v2/assets/app.css">
<style>
  .tag-st { font-size:12px; padding:2px 8px; border-radius:6px; white-space:nowrap; font-weight:600; }
  .tag-ok { background:rgba(39,174,96,.12); color:#4ade80; }
  .tag-warn { background:rgba(242,201,76,.12); color:#f2c94c; }
  .tag-bad { background:rgba(235,87,87,.12); color:#eb5757; }
  .tag-new { background:rgba(94,106,210,.14); color:#5e6ad2; }
  .tag-dim { background:#16161a; color:#a1a1aa; }
  .dim-dir { font-size:12px; font-weight:600; }
  .dir-pos { color:#4ade80; }
  .dir-neg { color:#eb5757; }
  .dir-rev { color:#f2c94c; }
  /* ★#323 因子用途分层徽章（外包 factor_usage） */
  .tag-usage-ext { background:rgba(94,106,210,.14); color:#8b5cf6; }
  .tag-usage-frc { background:rgba(242,201,76,.12); color:#f2c94c; }
  .tag-usage-def { background:rgba(242,201,76,.12); color:#f2c94c; }
  .tag-usage-dis { background:rgba(235,87,87,.12); color:#eb5757; }
  .fresh-bar { background:#131316; border:1px solid #2a2a30; border-left:3px solid #f2c94c; border-radius:8px; padding:8px 12px; margin-top:10px; font-size:12px; color:#a1a1aa; }
  .fresh-bar b { color:#f2c94c; }
  /* ★#330 生命周期筛选器 + 分钟因子小标 + 相关性热力图 */
  .life-filter { display:flex; gap:6px; margin:10px 0; }
  .lf-btn { border:1px solid #2a2a30; background:#131316; color:#a1a1aa; font-size:12px; padding:4px 14px; border-radius:14px; cursor:pointer; font-weight:600; transition:all .15s; }
  .lf-btn:hover { border-color:var(--navy2); color:var(--navy2); }
  .lf-btn.active { background:var(--navy2); color:#ffffff; border-color:var(--navy2); }
  .tag-minute { background:rgba(242,201,76,.12); color:#f2c94c; }
  .corr-wrap { overflow-x:auto; }
  .corr-grid { display:grid; gap:1px; font-size:10px; line-height:1; }
  .corr-cell { aspect-ratio:1; min-width:14px; border-radius:1px; }
  .corr-lbl { font-size:9px; color:#a1a1aa; white-space:nowrap; writing-mode:vertical-rl; transform:rotate(180deg); text-align:center; }
  .corr-tl { font-size:9px; color:#a1a1aa; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:14px; }
  .corr-legend-row { display:flex; gap:14px; margin-top:8px; font-size:12px; color:#a1a1aa; }
  /* ★#333 相关性热力图弹出式模态框（完整显示 26×26 + 完整坐标名） */
  .corr-modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:999; }
  .corr-modal.show { display:flex; }
  .corr-modal-box { background:#131316; border-radius:14px; max-width:94vw; max-height:90vh; overflow:auto; padding:18px 20px; box-shadow:0 20px 60px -20px rgba(0,0,0,.5); }
  .corr-modal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .corr-modal-close { cursor:pointer; font-size:22px; line-height:1; color:#a1a1aa; border:none; background:none; }
  .corr-modal-close:hover { color:#f4f4f5; }
  .corr-full-grid { display:grid; gap:2px; }
  .corr-full-cell { width:24px; height:24px; border-radius:2px; }
  .corr-full-lbl { font-size:12px; color:#a1a1aa; white-space:nowrap; text-align:right; padding-right:6px; display:flex; align-items:center; justify-content:flex-end; }
  .corr-full-tl { font-size:10px; color:#a1a1aa; writing-mode:vertical-rl; transform:rotate(180deg); display:flex; align-items:flex-start; justify-content:flex-end; padding:2px 0; }
  .corr-full-corner { width:140px; }
</style>
</head>
<body style="background:var(--bg);margin:0">
<div id="sidebar"></div>
<div class="v2-wrap">
  <div class="v2-h"><span class="bar"></span><h1>因子</h1><span class="sub">当前因子 · 风控层 · 推荐质量 · 综合排名</span></div>

  <!-- 拥挤度仪表 -->
  <div class="v2-summary anim-fade-in-up" id="crowd-box" style="margin-top:14px">
    <span class="mini" style="opacity:.6"> 加载拥挤度…</span>
  </div>

  <!-- ★#329 风格轮动（factor_style_rotation：当前风格 + boost/trim 因子族） -->
  <div class="v2-summary anim-fade-in-up" id="style-box" style="margin-top:10px;display:none"></div>

  <!-- ★#323 数据时效提示条（外包 factor_data_freshness） -->
  <div class="fresh-bar anim-fade-in-up" id="fresh-box" style="display:none"></div>

  <div id="tabs-demo" style="margin-top:14px"></div>
</div>

<!-- ★#333 相关性热力图弹出式模态框 -->
<div class="corr-modal" id="corr-modal">
  <div class="corr-modal-box">
    <div class="corr-modal-head">
      <h2 id="corr-modal-title" style="margin:0;font-size:15px">相关性热力图 <span class="mini" style="font-weight:400;color:#a1a1aa">红=正相关 · 绿=负相关 · 深色对角线=自身</span></h2>
      <button class="corr-modal-close" id="corr-modal-close">×</button>
    </div>
    <div id="corr-modal-body"></div>
  </div>
</div>

<script src="/v2/core/api.js"></script>
<script src="/v2/core/render.js"></script>
<script src="/v2/components/icons.js"></script>
<script src="/v2/components/search.js"></script>
<script src="/v2/components/sidebar.js"></script>
<script src="/v2/components/tabs.js"></script>
<script>
(function () {
  LW.sidebar.render('sidebar', {active: 'factors'});
  var R = LW.render;
  R.loadEnums();   // ★#348 预热 enums（因子族中文名/族色动态下发）

  /* 去 emoji（API status 带 ✅❌🟡⚠️） */
  function stripEmoji(s) {
    return String(s == null ? '' : s).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE00}-\u{FE0F}\u{2190}-\u{21FF}\u{2300}-\u{23FF}]/gu, '').trim();
  }

  // ★#323 因子池 UI 数据包（外包 output/ui_data/ 5 文件：用途分层/生命周期/相关性/FRC规则/时效）
  var UI = { usage: {}, lifecycle: {}, corr: {}, frc_rules: {}, freshness: {}, style_rotation: {}, alert_rules: {} };
  LW.api.get('/api/live/factor_ui_pack').then(function (d) {
    UI = d || UI;
    renderFreshness();
    renderStyleRotation();
  }).catch(function () {});

  /* ★#329 风格轮动摘要（当前风格 + boost/trim 因子族） */
  function renderStyleRotation() {
    var sr = UI.style_rotation || {};
    var cur = sr.current_style;
    if (!cur) return;
    var box = document.getElementById('style-box');
    if (!box) return;
    // ★#348 风格颜色从 enums 动态下发（不写死 styleColors）
    var cc = R.styleColor(cur);
    var w = (sr.weights || {})[cur] || {};
    var boost = (w.boost || []).map(function (f) { return '<span class="tag-st tag-ok" style="margin:0 2px">' + f + '</span>'; }).join('');
    var trim = (w.trim || []).map(function (f) { return '<span class="tag-st tag-dim" style="margin:0 2px">' + f + '</span>'; }).join('');
    box.style.display = 'block';
    box.innerHTML =
      '<span class="tm"> 风格轮动 · <span style="color:' + cc + '">' + R._f(cur) + ' 期</span></span>' +
      '<span class="mini">F3 风格状态机 · 加权 ' + boost + ' · 降权 ' + trim + '</span>' +
      '<span class="mini" style="opacity:.6">EXT 命中时 boost ×1.2 / trim ×0.8（与 ICIR120 降权叠加）</span>';
  }

  /* 数据时效提示条 */
  function renderFreshness() {
    var f = UI.freshness || {};
    var box = document.getElementById('fresh-box');
    if (!box) return;
    var m1 = f.minute_1m || {}, m5 = f.minute_5m || {};
    var lag = m1.lag_days || m5.lag_days || '';
    if (!lag) return;
    box.style.display = 'block';
    box.innerHTML = '数据时效：分钟因子最新值 <b>滞后 ' + R._f(lag) + '</b>（1m 覆盖 ' + R._f(m1.coverage) + '）——相关因子显示「—」为正常，补齐后自动追平';
  }

  /* ★#323 因子用途分层徽章（EXT 决策/排雷/暂缓/禁用） */
  function usageBadge(code) {
    var layers = (UI.usage && UI.usage.layers) || {};
    if (layers.ext_decision && layers.ext_decision[code]) return '<span class="tag-st tag-usage-ext">EXT 决策</span>';
    if (layers.frc_mine && layers.frc_mine[code] != null) return '<span class="tag-st tag-usage-frc">排雷</span>';
    if (layers.deferred && layers.deferred[code]) return '<span class="tag-st tag-usage-def">暂缓</span>';
    if (layers.disabled && layers.disabled[code] != null) return '<span class="tag-st tag-usage-dis">禁用</span>';
    return '';
  }

  /* ★#330 分钟因子识别（D15 分钟派生 + kline 形态 + 日内结构）——ICIR 缺失时标"分钟·滞后" */
  var MINUTE_PATTERN = /(strong_close|open_vol|intraday|tail_vol|tail_strong|pm_ret|am_pm|close30|tail60|kline_)/i;
  function isMinute(f) {
    return (f.category === 'kline') || MINUTE_PATTERN.test(f.code || '');
  }

  /* 拥挤度仪表 */
  LW.api.get('/api/live/factor_dash').then(function (d) {
    var c = d.crowding || {};
    var box = document.getElementById('crowd-box');
    var pct = c.pctile != null ? (c.pctile * 100).toFixed(1) + '%' : '—';
    box.innerHTML =
      '<span class="tm"> 市场拥挤度 ' + pct + '</span>' +
      '<span class="mini">' + stripEmoji(c.zone || '—') + ' · 拥挤 ' + R._f(c.n_crowded) + ' 只 · ' + R._f(c.date) + '</span>' +
      '<span class="mini" style="opacity:.6">252 日分位（越低越冷清，>80% 警惕泡沫）</span>';
  }).catch(function () {});

  /* 状态徽章（去 emoji 纯文字 + 色块） */
  function badge(status) {
    var s = stripEmoji(status);
    if (!s) return '<span class="tag-st tag-dim">—</span>';
    if (s.indexOf('有效') >= 0 || s.indexOf('正常') >= 0) return '<span class="tag-st tag-ok">' + s + '</span>';
    if (s.indexOf('弱') >= 0 || s.indexOf('衰减') >= 0 || s.indexOf('漂移') >= 0 || s.indexOf('数据不足') >= 0) return '<span class="tag-st tag-warn">' + s + '</span>';
    if (s.indexOf('失效') >= 0 || s.indexOf('反向') >= 0) return '<span class="tag-st tag-bad">' + s + '</span>';
    return '<span class="tag-st tag-new">' + s + '</span>';
  }

  /* 方向显示（+1 正向 / -1 反向 / null 未定） */
  function dirCell(dir) {
    if (dir == null) return '<span class="dim-dir" style="opacity:.4">—</span>';
    if (dir > 0) return '<span class="dim-dir dir-pos">正向</span>';
    return '<span class="dim-dir dir-rev">反向</span>';
  }

  /* ★#338 分级预警徽章（factor_alert_rules：红=禁用/橙=降权/黄=观察） */
  function alertBadge(level) {
    if (level === 'red') return '<span class="tag-st tag-bad">红 · 禁用</span>';
    if (level === 'orange') return '<span class="tag-st tag-warn">橙 · 降权</span>';
    if (level === 'yellow') return '<span class="tag-st tag-new">黄 · 观察</span>';
    return '';
  }

  /* Tab 1：当前因子（统一表格：因子/代码/分类/方向/ICIR60/状态） */
  function loadCurrent(box) {
    LW.api.get('/api/live/factor_dash').then(function (d) {
      var mf = d.manifest || {};
      var fs = mf.factors || [];
      var cats = d.categories || {};
      var catHtml = Object.keys(cats).map(function (k) {
        return '<span class="tag-st tag-dim" style="margin:0 4px 4px 0;display:inline-block">' + k + ' ' + cats[k] + '</span>';
      }).join('');
      var rows = fs.map(function (f) {
        var ic = f.icir_60 != null ? Number(f.icir_60).toFixed(2) : null;
        var isMin = isMinute(f);
        var icCell = ic != null ? '<span class="td-num" style="display:inline-block;width:100%">' + ic + '</span>'
          : (isMin ? '<span class="tag-st tag-minute">分钟·滞后</span>' : '<span style="opacity:.4">—</span>');
        return '<tr><td><b>' + R._f(f.name_cn || f.code) + '</b></td>' +
          '<td style="color:#a1a1aa">' + R._f(f.code) + '</td>' +
          '<td style="color:#a1a1aa">' + R._f(f.category) + '</td>' +
          '<td>' + dirCell(f.direction) + '</td>' +
          '<td style="text-align:right">' + icCell + '</td>' +
          '<td>' + badge(f.status) + '</td>' +
          '<td>' + usageBadge(f.code) + '</td></tr>';
      }).join('');
      var staleTip = mf.health_stale
        ? '<div class="fresh-bar" style="margin:0 0 10px">清单状态基于旧体检（health_date ' + R._f(mf.health_date) + ' 非当天），请等待今日体检刷新</div>'
        : '';
      box.innerHTML =
        '<div class="v2-card" style="margin-top:0"><h2> 当前因子 <span class="tag">' + fs.length + ' 个 · ' + R._f(mf.date) + '</span></h2>' +
        staleTip +
        '<div class="mini" style="margin:6px 0 10px">' + catHtml + '</div>' +
        '<table><thead><tr><th>因子</th><th>代码</th><th>分类</th><th>方向</th><th style="text-align:right">ICIR60</th><th>状态</th><th>用途</th></tr></thead><tbody>' +
        (rows || '<tr><td colspan="7" class="mini" style="text-align:center;opacity:.6">暂无</td></tr>') + '</tbody></table></div>';
    }).catch(function (e) { box.innerHTML = ' ' + e; });
  }

  /* Tab 2：风控层（health 按 status 分组——没过风控的失效/弱有效/反向/衰减全展示） */
  function loadRisk(box) {
    LW.api.get('/api/live/factor_dash').then(function (d) {
      var hr = (d.health && d.health.rows) || [];
      // 风控分组（★2026-08-15 修复：①'弱有效'含'有效'子串被 ok 抢走 → ok 排除弱有效
      //   ②'低频因子'无归属 → 并入数据不足 ③'衰减(短期反向)'含'反向' → 衰减组先于反向组判定）
      var groups = [
        { key: 'ok',      title: '通过风控', desc: '有效 · 可正常用于选股',     match: function (s) { return s.indexOf('有效') >= 0 && s.indexOf('弱有效') < 0; } },
        { key: 'weak',    title: '弱有效',   desc: 'ICIR 偏低，谨慎使用',        match: function (s) { return s.indexOf('弱有效') >= 0; } },
        { key: 'decay',   title: '衰减',     desc: '短期走弱/反向，不宜选股',    match: function (s) { return s.indexOf('衰减') >= 0; } },
        { key: 'rev',     title: '反向漂移', desc: '注册方向已失效（负 ICIR）',  match: function (s) { return s.indexOf('反向漂移') >= 0 || (s.indexOf('反向') >= 0 && s.indexOf('有效') < 0); } },
        { key: 'dead',    title: '失效',     desc: 'ICIR 归零，暂停使用',        match: function (s) { return s.indexOf('失效') >= 0; } },
        { key: 'nodata',  title: '数据不足', desc: '样本不足/低频未体检，待积累', match: function (s) { return s.indexOf('数据不足') >= 0 || s.indexOf('低频') >= 0; } }
      ];
      var cards = groups.map(function (g) {
        var list = hr.filter(function (r) { return g.match(stripEmoji(r.status || '')); });
        var body;
        if (!list.length) { body = '<div class="mini" style="opacity:.5">无</div>'; }
        else {
          var trs = list.map(function (r) {
            var ic = r.icir120 != null ? Number(r.icir120).toFixed(3) : '—';
            var t = r.t120 != null ? Number(r.t120).toFixed(1) : '—';
            return '<tr><td><b>' + R._f(r.factor) + '</b></td>' +
              '<td>' + badge(r.status) + '</td>' +
              '<td class="td-num">' + ic + '</td>' +
              '<td class="td-num">' + t + '</td></tr>';
          }).join('');
          // ★2026-08-15 排版：组内表格限高滚动（通过组 38 因子不再撑爆整页）
          body = '<div style="max-height:340px;overflow-y:auto;border:1px solid #26262c;border-radius:8px">' +
            '<table><thead><tr><th>因子</th><th>状态</th><th style="text-align:right">ICIR120</th><th style="text-align:right">t120</th></tr></thead><tbody>' + trs + '</tbody></table></div>';
        }
        var accent = g.key === 'ok' ? '#4ade80' : g.key === 'weak' ? '#f2c94c' : '#eb5757';
        return '<div class="v2-card" style="margin-top:0"><h2> ' + g.title + ' <span class="tag">' + list.length + ' 个 · ' + g.desc + '</span></h2>' + body + '</div>';
      }).join('');
      var pass = hr.filter(function (r) { return stripEmoji(r.status || '').indexOf('有效') >= 0 && stripEmoji(r.status || '').indexOf('弱有效') < 0; }).length;
      var weak = hr.filter(function (r) { return stripEmoji(r.status || '').indexOf('弱有效') >= 0; }).length;
      var total = hr.length;
      // ★#323 FRC 排雷规则明细（外包 frc_mine_rules）★#373 字段名修复：后端返回 frc_rules（非 frc）
      var frc = UI.frc_rules || {};
      var frcRules = (frc.rules || []).map(function (r) {
        return '<div class="dt-line"><span class="db">' + R._f(r.factor) + '</span>' +
          '<span class="mini" style="color:#f2c94c;font-weight:600">' + (r.deduct != null ? '减 ' + r.deduct + ' 分' : '') + '</span>' +
          '<span class="cs">' + R._f(r.ex60) + ' · ' + R._f(r.stability) + '</span></div>';
      }).join('');
      var frcHtml = frcRules
        ? '<div class="v2-card" style="margin-top:14px;border-color:#ea580c33"><h2> FRC 排雷规则 <span class="tag">' + R._f(frc.trigger) + ' · 减分制（不硬剔除）</span></h2>' + frcRules +
          '<div class="mini" style="margin-top:6px;opacity:.7">' + R._f(frc.iron_rule) + '</div></div>'
        : '';
      // ★#338 分级预警（factor_alert_rules：红=禁用/橙=降权/黄=观察领先指标）
      var ar = UI.alert_rules || {};
      var arAlerts = ar.alerts || [];
      var arLevels = { red: '禁用（方向反/失效）', orange: '降权（ICIR120<0.3）', yellow: '观察（60d IC 转负）' };
      var arHtml = '';
      if (arAlerts.length) {
        var arRows = ['red', 'orange', 'yellow'].map(function (lv) {
          var list = arAlerts.filter(function (a) { return a.level === lv; });
          if (!list.length) return '';
          var trs = list.map(function (a) {
            return '<tr><td><b>' + R._f(a.factor) + '</b></td>' +
              '<td class="td-num">' + (a.icir120 != null ? Number(a.icir120).toFixed(3) : '—') + '</td>' +
              '<td>' + stripEmoji(a.status || '') + '</td></tr>';
          }).join('');
          return '<div class="v2-card" style="margin-top:0;border-color:' + (lv === 'red' ? '#C0392B33' : '#b7791f33') + '"><h2> ' + alertBadge(lv) + ' <span class="tag">' + list.length + ' 个 · ' + arLevels[lv] + '</span></h2>' +
            '<table><thead><tr><th>因子</th><th style="text-align:right">ICIR120</th><th>状态</th></tr></thead><tbody>' + trs + '</tbody></table></div>';
        }).filter(Boolean).join('');
        if (arRows) {
          arHtml = '<div class="mini" style="font-weight:600;margin:14px 0 4px;color:#d4d4d8">分级预警（factor_alert_rules · 每日自动）</div>' +
            '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start">' + arRows + '</div>';
        }
      }
      box.innerHTML =
        '<div class="v2-summary" style="margin-top:0"><span class="tm"> 风控层 · 通过 ' + pass + ' / 弱有效 ' + weak + ' / 共 ' + total + '</span>' +
        '<span class="mini">反向/失效/衰减因子一律不得用于选股（FRC 排雷）</span></div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start">' + cards + '</div>' + frcHtml + arHtml;
    }).catch(function (e) { box.innerHTML = ' ' + e; });
  }

  /* Tab 3：推荐质量（factor_perf 实盘 pitch 业绩） */
  function loadPerf(box) {
    // ★#348 并行拉 factor_perf + calendar（T+5 到期日动态，不写死"08-14"）
    Promise.all([
      LW.api.get('/api/live/factor_perf'),
      LW.api.get('/api/live/calendar').catch(function () { return {}; })
    ]).then(function (res) {
      var d = res[0];
      if (!d.ok) { box.innerHTML = ' ' + d.err; return; }
      var hz = (res[1] && res[1].horizons) || {};
      var t5due = (hz.t5 && hz.t5.next_due) || '';
      var rows = (d.factors || []).map(function (f) {

  /* ★#323 Tab 5：因子生命周期（外包 factor_lifecycle——滚动 120 日 ICIR 月度时序）
     ★#330 增强：①趋势用近 3 月斜率（非 latest-prev 单点差，mom60 大波动误判）②筛选器（全部/增强/衰减/稳定） */
  function loadLifecycle(box) {
    var fs = UI.lifecycle.factors || {};
    var keys = Object.keys(fs);
    if (!keys.length) { box.innerHTML = '<div class="mini" style="opacity:.6">生命周期数据未接入</div>'; return; }
    function slopeOf(v) {
      var series = v.series || [];
      var vals = series.map(function (s) { return s.icir120; });
      if (vals.length < 4) return null;
      var n = vals.length;
      return vals[n - 1] - vals[n - 3];   // 近 3 月 ICIR 变化（斜率）
    }
    var data = keys.map(function (k) {
      var v = fs[k] || {};
      var slope = slopeOf(v);
      var phase = slope == null ? 'stable' : (slope > 0.05 ? 'up' : (slope < -0.05 ? 'down' : 'stable'));
      return { k: k, v: v, slope: slope, phase: phase };
    });
    var filter = 'all';
    function renderList() {
      var list = data.filter(function (o) { return filter === 'all' || o.phase === filter; });
      var cards = list.map(function (o) {
        var v = o.v;
        var vals = (v.series || []).map(function (s) { return s.icir120; });
        var trendTxt = o.slope != null ? (o.slope >= 0 ? '近3月 增强 +' : '近3月 衰减 ') + o.slope.toFixed(2) : '';
        var trendCls = o.slope != null ? (o.slope >= 0 ? 'var(--red)' : 'var(--green)') : 'var(--muted)';
        return '<div class="v2-card" style="margin-top:0"><h2 style="display:flex;align-items:baseline">' + R._f(o.k) +
          '<span class="tag" style="margin-left:8px">最新 ' + (v.latest != null ? Number(v.latest).toFixed(2) : '—') +
          (trendTxt ? ' · <b style="color:' + trendCls + '">' + trendTxt + '</b>' : '') + '</span></h2>' +
          R.spark(vals) + '</div>';
      }).join('');
      return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start">' + (cards || '<div class="mini" style="opacity:.6;padding:10px 0">无匹配因子</div>') + '</div>';
    }
    var opts = [['all', '全部'], ['up', '增强'], ['down', '衰减'], ['stable', '稳定']];
    var filterHtml = '<div class="life-filter">' + opts.map(function (o) {
      return '<button class="lf-btn' + (filter === o[0] ? ' active' : '') + '" data-f="' + o[0] + '">' + o[1] + '</button>';
    }).join('') + '</div>';
    box.innerHTML =
      '<div class="v2-summary" style="margin-top:0"><span class="tm"> 因子生命周期 </span><span class="mini">滚动 120 日 ICIR 月度采样（2016-2026）· 近 3 月斜率判趋势（避免单点大波动误判）</span></div>' +
      filterHtml + '<div id="life-list">' + renderList() + '</div>';
    var fb = box.querySelector('.life-filter');
    if (fb) fb.addEventListener('click', function (e) {
      var b = e.target.closest('.lf-btn');
      if (!b) return;
      filter = b.getAttribute('data-f');
      box.querySelectorAll('.lf-btn').forEach(function (x) { x.classList.toggle('active', x === b); });
      document.getElementById('life-list').innerHTML = renderList();
    });
  }

  /* ★#323 Tab 6：因子相关性（外包 factor_corr——26 因子正交图谱）
     ★#330 增强：加 26×26 热力图（原只有高相关对列表） */
  function loadCorr(box) {
    var factors = UI.corr.factors || [];
    var matrix = UI.corr.matrix || [];
    var n = factors.length;
    // 检测有效数据（非 null 元素数）——factor_corr matrix 可能全 NaN（因子池数据 bug）
    var valid = 0;
    for (var i = 0; i < n; i++) {
      for (var j = 0; j < n; j++) {
        if (matrix[i] && matrix[i][j] != null) valid++;
      }
    }
    var hasData = valid > 0;
    var pairs = [];
    for (var i = 0; i < n; i++) {
      for (var j = i + 1; j < n; j++) {
        var c = matrix[i] ? matrix[i][j] : null;
        if (c != null && Math.abs(c) > 0.4) pairs.push([factors[i], factors[j], c]);
      }
    }
    pairs.sort(function (a, b) { return Math.abs(b[2]) - Math.abs(a[2]); });
    var pairHtml = pairs.length ? pairs.slice(0, 20).map(function (p) {
      return '<div class="dt-line"><span class="db">' + R._f(p[0]) + ' × ' + R._f(p[1]) + '</span>' +
        '<span style="font-variant-numeric:tabular-nums;font-weight:600;color:' + (p[2] > 0 ? 'var(--red)' : 'var(--green)') + '">' + p[2].toFixed(3) + '</span></div>';
    }).join('') : '<div class="mini" style="opacity:.7;padding:6px 0">' + (hasData ? n + ' 核心因子近端正交性良好（|corr|>0.4 无高相关对）——复合决策无障碍' : '相关性数据未就绪') + '</div>';
    // ★#333 热力图：改成弹出式模态框（完整显示 26×26 + 完整坐标名）
    function heatColor(c) {
      if (c == null) return '#a1a1aa';
      var a = Math.min(1, Math.abs(c));
      return c > 0 ? 'rgba(235,87,87,' + (a * 0.85).toFixed(2) + ')' : 'rgba(39,174,96,' + (a * 0.85).toFixed(2) + ')';
    }
    function heatModalHtml() {
      var topRow = '<div class="corr-full-corner"></div>' + factors.map(function (f) { return '<div class="corr-full-tl" title="' + f + '">' + f + '</div>'; }).join('');
      var rows = factors.map(function (f, ri) {
        var cells = factors.map(function (g, ci) {
          var c = matrix[ri] ? matrix[ri][ci] : null;
          if (ri === ci) return '<div class="corr-full-cell" style="background:#111114" title="' + f + '"></div>';
          return '<div class="corr-full-cell" style="background:' + heatColor(c) + '" title="' + f + ' × ' + g + ' = ' + (c != null ? c.toFixed(3) : '—') + '"></div>';
        }).join('');
        return '<div class="corr-full-lbl" title="' + f + '">' + f + '</div>' + cells;
      }).join('');
      return '<div class="corr-full-grid" style="grid-template-columns:140px repeat(' + n + ',24px)">' + topRow + rows + '</div>' +
        '<div class="corr-legend-row"><span><span style="display:inline-block;width:10px;height:10px;background:rgba(235,87,87,.85);border-radius:1px"></span> 正相关</span>' +
        '<span><span style="display:inline-block;width:10px;height:10px;background:rgba(39,174,96,.85);border-radius:1px"></span> 负相关</span>' +
        '<span><span style="display:inline-block;width:10px;height:10px;background:#16161a;border-radius:1px"></span> 低/无</span></div>';
    }
    var heatArea = hasData
      ? '<button class="v2-btn" id="corr-heat-btn">查看 ' + n + '×' + n + ' 热力图</button>'
      : '<div class="mini" style="opacity:.6;padding:6px 0">相关性矩阵数据未就绪（factor_corr matrix 为空）——待因子池修复后自动补全</div>';
    box.innerHTML =
      '<div class="v2-summary" style="margin-top:0"><span class="tm"> 因子相关性 </span><span class="mini">' + R._f(UI.corr.period) + ' · ' + R._f(UI.corr.method) + '</span></div>' +
      '<div class="v2-card" style="margin-top:14px"><h2> ' + n + '×' + n + ' 相关性热力图 <span class="tag">红=正相关 · 绿=负相关</span></h2>' + heatArea + '</div>' +
      '<div class="v2-card" style="margin-top:14px"><h2> 高相关对（|corr|>0.4） <span class="tag">' + pairs.length + ' 对</span></h2>' + pairHtml + '</div>' +
      '<div class="mini" style="margin-top:10px;opacity:.6">复合前 |corr|<0.2 才复合（防破坏规范第 9 条）</div>';
    // 绑定模态框
    var btn = document.getElementById('corr-heat-btn');
    if (btn) btn.onclick = function () {
      var mt = document.getElementById('corr-modal-title');
      if (mt) mt.childNodes[0].nodeValue = n + '×' + n + ' 相关性热力图 ';
      document.getElementById('corr-modal-body').innerHTML = heatModalHtml();
      document.getElementById('corr-modal').classList.add('show');
    };
  }

  (function () {

  /* Tab 7：★动态回测（按参数即时跑 + SVG 净值曲线 + 下方档案列表） */
  function svgNav(dates, nav, benchNav) {
    var W = 900, H = 250, PL = 52, PR = 16, PT = 12, PB = 30;
    var all = nav.concat(benchNav || []);
    if (!all.length) return '<div class="mini" style="opacity:.6">无数据</div>';
    var lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
    if (hi - lo < 1e-9) hi = lo + 1;
    function px(i, n) { return PL + i * (W - PL - PR) / Math.max(n - 1, 1); }
    function py(v) { return PT + (1 - (v - lo) / (hi - lo)) * (H - PT - PB); }
    function line(arr, color, w, dash) {
      var pts = [];
      for (var i = 0; i < arr.length; i++) pts.push(px(i, arr.length).toFixed(1) + ',' + py(arr[i]).toFixed(1));
      return '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + color +
        '" stroke-width="' + w + '"' + (dash ? ' stroke-dasharray="5,4"' : '') + '><title>' + color + '</title></polyline>';
    }
    var grid = '';
    for (var g = 0; g <= 4; g++) {
      var gy = (PT + g * (H - PT - PB) / 4).toFixed(1);
      grid += '<line x1="' + PL + '" y1="' + gy + '" x2="' + (W - PR) + '" y2="' + gy + '" stroke="#d4d4d8" stroke-width="1"/>';
    }
    var lbl = '<text x="' + PL + '" y="' + (H - 8) + '" font-size="10" fill="#a1a1aa">' + (dates[0] || '') + '</text>' +
      '<text x="' + (W - PR) + '" y="' + (H - 8) + '" font-size="10" fill="#a1a1aa" text-anchor="end">' + (dates[dates.length - 1] || '') + '</text>' +
      '<text x="' + (W - PR) + '" y="' + (PT + 8) + '" font-size="10" fill="#a1a1aa" text-anchor="end">高 ' + hi.toFixed(2) + '</text>';
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto">' + grid + lbl +
      (benchNav && benchNav.length ? line(benchNav, '#f2c94c', 1.4, true) : '') + line(nav, '#5e6ad2', 2) + '</svg>';
  }

            '<div class="mini" style="margin:6px 0 4px;color:#a1a1aa">' + facs + '</div>' +
            '<div class="mini" style="margin:6px 0;color:#a1a1aa">年化 <b style="color:' + annC + '">' + ann + '</b> · 回撤 <b style="color:#27ae60">' + dd + '</b> · 夏普 <b>' + shp + '</b></div>' +
            '<a class="v2-btn" href="/dl/backtest_archive/' + encodeURIComponent(fname(a.html)) + '" target="_blank">打开报告</a>' +
          '</div>';
        }).join('') + '</div>';
    }
    LW.api.get('/api/live/backtest_archive').then(function (d) {
      archives = (d && d.archives) || [];
      var cats = ['全部'].concat(Array.from(new Set(archives.map(function (a) { return a.category; }))));
      document.getElementById('bt-archive').innerHTML =
        '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center">' +
          '<span class="mini">筛选：</span>' +
          '<select id="bt-cat" class="lf-btn" style="cursor:pointer">' +
            cats.map(function (c) { return '<option value="' + c + '">' + c + '</option>'; }).join('') +
          '</select>' +
          '<input id="bt-kw" placeholder="搜索名称/标题/因子" style="flex:1;min-width:160px;padding:6px 10px;border:1px solid #2a2a30;border-radius:8px;font-size:12px;outline:none">' +
          '<span class="mini" style="opacity:.6">' + archives.length + ' 份</span>' +
        '</div><div id="bt-archive-list"></div>';
      document.getElementById('bt-cat').onchange = function () { afCat = this.value; renderArchive(); };
      document.getElementById('bt-kw').oninput = function () { afKw = this.value; renderArchive(); };
      renderArchive();
    }).catch(function () {
      document.getElementById('bt-archive').innerHTML = '<div class="mini" style="opacity:.6">档案加载失败</div>';
    });
  }

  /* ★P3-1 净化分类（L1 因子净化层可视化——A 稳定/B 反转/C 噪声，对应设计书与用户"120 因子大量失效"现状） */
  function loadPurify(box) {
    LW.api.get('/api/live/factor_dash').then(function (d) {
      var hr = (d.health && d.health.rows) || [];
      var rows = hr.map(function (r) {
        var s = stripEmoji(r.status || '');
        var ic = r.icir120 != null ? +r.icir120 : null;
        var icChg = r.icir120_chg != null ? +r.icir120_chg : null;
        var eff = (ic != null && Math.abs(ic) >= 0.2);
        var reversed = s.indexOf('反向') >= 0 || (ic != null && ic < -0.1);
        var decaying = s.indexOf('衰减') >= 0 || (icChg != null && icChg < -0.1);
        var noisy = s.indexOf('失效') >= 0 || s.indexOf('数据不足') >= 0 || (ic != null && Math.abs(ic) < 0.1);
        var cls, label, clsCls;
        if (reversed || decaying) { cls = 'B'; label = 'B 反转/漂移（动态符号）'; clsCls = 'tag-usage-frc'; }
        else if (eff && !noisy) { cls = 'A'; label = 'A 稳定正向'; clsCls = 'tag-usage-ext'; }
        else { cls = 'C'; label = 'C 噪声/弱（剔除）'; clsCls = 'tag-usage-def'; }
        var note = s + (ic != null ? ' · ICIR120 ' + ic.toFixed(2) : '') +
          (icChg != null ? ' · 变化 ' + (icChg >= 0 ? '+' : '') + icChg.toFixed(2) : '');
        return '<div class="sq-factor" style="padding:7px 10px;margin-bottom:4px">' +
          '<span class="tag-st ' + clsCls + '" style="min-width:52px;text-align:center">' + label.split(' ')[0] + '</span>' +
          '<b style="font-size:13px">' + R._f(r.factor) + '</b>' +
          '<span class="mini" style="color:#a1a1aa">' + note + '</span>' +
          (cls === 'B' ? '<span class="mini" style="color:#f2c94c">可反向利用（需模型识别方向）</span>' : '') +
          (cls === 'A' ? '<span class="mini" style="color:#4ade80">可正常入选股</span>' : '') +
          (cls === 'C' ? '<span class="mini" style="color:#a1a1aa">不进入决策链</span>' : '') + '</div>';
      }).join('');
      var nA = rows ? rows.match(/class="tag-st tag-usage-ext"/g) : [];
      var nB = rows ? rows.match(/tag-usage-frc"/g) : [];
      var nC = rows ? rows.match(/tag-usage-def"/g) : [];
      box.innerHTML = '<div class="v2-card" style="margin-top:0"><h2> 因子净化分类 <span class="tag">L1 净化层 · A 稳定 / B 反转 / C 噪声</span></h2>' +
        '<div class="mini" style="margin-bottom:8px;line-height:1.9">' +
        '<span class="tag-st tag-usage-ext">A 稳定正向 ' + (nA ? nA.length : 0) + '</span> 可正常入选股 · ' +
        '<span class="tag-st tag-usage-frc">B 反转/漂移 ' + (nB ? nB.length : 0) + '</span> 动态符号（不固定权重）· ' +
        '<span class="tag-st tag-usage-def">C 噪声/弱 ' + (nC ? nC.length : 0) + '</span> 剔除不出决策链' +
        '</div>' + (rows || '<div class="mini">无数据</div>') + '</div>';
    }).catch(function (e) { box.innerHTML = ' ' + e; });
  }

  var fTabs = LW.tabs.init('tabs-demo', [
    { id: 'purify', label: '净化', load: loadPurify },
    { id: 'cur', label: '当前因子', load: loadCurrent },
    { id: 'risk', label: '风控层', load: loadRisk },
    { id: 'life', label: '生命周期', load: loadLifecycle },
    { id: 'corr', label: '相关性', load: loadCorr },
    { id: 'perf', label: '推荐质量', load: loadPerf },
    { id: 'rank', label: '综合排名', load: loadRanking }
  ]);
  // ★#360 回到页面时刷新（因子池 18:30/19:00 链更新后切回自动见最新，替代定时轮询）
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { fTabs.reload(); }
  });
})();
</script>
