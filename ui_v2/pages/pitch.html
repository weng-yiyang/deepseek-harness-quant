<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Deepseek HARNESS Quant · 决策</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/v2/assets/ui_common.css">
<link rel="stylesheet" href="/v2/assets/anim_common.css">
<link rel="stylesheet" href="/v2/assets/app.css">
<style>
  .opp-row { display:flex; align-items:center; gap:10px; padding:8px 10px; border-bottom:1px solid rgba(255,255,255,.08); font-size:12px; }
  .opp-row:hover { background:#16161a; }
  .opp-row .code { font-weight:600; min-width:90px; }
  .opp-row .nm { color:var(--muted); min-width:70px; }
  .tag-ot { font-size:10px; padding:1px 7px; border-radius:8px; background:#1c1c22; color:var(--navy); }
  .sc { font-weight:700; min-width:52px; text-align:right; }
  /* ★2026-08-16 对比度修复：暗紫 #5e6ad2 在深色底上可读性差 → 页面级统一提亮（覆盖行内样式） */
  [style*="color:#5e6ad2"] { color:#aab6fa !important; }
  /* 深色底上的暗灰说明文字统一提亮一档 */
  .opp-row .nm, [style*="color:#a1a1aa"] { color:#c4c4cd !important; }
</style>
</head>
<body style="background:var(--bg);margin:0">
<div id="sidebar"></div>
<div class="v2-wrap">
  <div class="v2-h"><span class="bar"></span><h1>决策</h1><span class="sub">L0 择时 · L2 Pitch 长线/短线 · L1 参考 · 买入指令=卡片同源</span></div>
  <div class="mini" style="opacity:.7">UI v2 · 决策桌 · Pitch 卡片支持买入/放弃审批（长线/短线独立 Tab）</div>

  <!-- ★2026-08-16 常用功能栏（择时/Pitch/ETF/参考/历史）置顶：最常用入口放在页面最上方 -->
  <div id="tabs-demo" style="margin-top:14px"></div>

  <!-- ★2026-08-15 数据日状态条：盘中显示"最新完整交易日 08-13"属正常（今日 18:30 收盘后更新为 08-14），
       解决"决策栏大量昨天 pitch 误以为数据卡住"的观感 -->
  <div id="data-day-bar" style="margin-top:10px;padding:8px 14px;background:#16161a;border:1px solid #2a2a30;border-radius:10px;
       font-size:12px;line-height:1.8;display:none"></div>

  <!-- ★2026-08-15 今日买入指令（Pitch 长+短待审批聚合 = L2 决策卡片一致视图；与卡片同源联动审批）
       ★2026-08-16 默认折叠：仅标题行可见，主动点击展开（grid-rows 动画，busy 锁防重复触发） -->
  <div class="v2-card anim-fade-in-up d0" id="buy-order-box" style="margin-top:14px;display:none">
    <div id="buy-order-head" style="display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;padding:2px 0">
      <span id="buy-order-chev" style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:#1c1c22;border:1px solid #2a2a30;color:#a1a1aa;font-size:11px;transition:color .15s,transform .2s">▼</span>
      <h2 style="margin:0;flex:1;font-size:16px"> 今日买入指令 <span class="tag" id="buy-order-tag">加载中…</span></h2>
      <span class="mini" id="buy-order-state" style="color:var(--muted)">已折叠 · 点击展开</span>
    </div>
    <div id="buy-order-collapse" style="display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s var(--ease-hover)">
      <div style="overflow:hidden">
        <div id="buy-order-body" style="margin-top:10px"><div class="mini" style="opacity:.6">加载中…</div></div>
      </div>
    </div>
  </div>

  <!-- ★2026-08-15 当前持仓状态条：决策页衔接持仓池（审批时可见剩余名额与现有持仓，≤5 纪律透明） -->
  <div class="v2-card anim-fade-in-up" id="holdings-strip" style="margin-top:10px;display:none">
    <h2 style="font-size:14px"> 当前持仓 <span class="tag" id="holdings-strip-tag">…</span></h2>
    <div id="holdings-strip-body" style="margin-top:8px"><span class="mini" style="opacity:.6">加载中…</span></div>
  </div>

</div>

<script src="/v2/core/api.js"></script>
<script src="/v2/core/render.js"></script>
<script src="/v2/components/icons.js"></script>
<script src="/v2/components/search.js"></script>
<script src="/v2/components/sidebar.js"></script>
<script src="/v2/components/tabs.js"></script>
<script src="/v2/components/decide.js"></script>
<script>
(function () {
  LW.sidebar.render('sidebar', {active: 'pitch'});
  var R = LW.render;
  R.loadEnums();   // ★#348 预热 enums（类型中文名动态下发）

  // ★2026-08-15 今日买入指令 —— ★P0-1 同源化改造：读 Pitch 长+短候选聚合（与各 Tab 卡片同一套数据源
  //   /api/pitch_v2 + /api/live/tech），带审批状态与买入/放弃按钮——顶部指令 = 下方卡片的一致视图。
  //   L0 择时档位作为总闸：防守档（观望/离场）→ 显示"无买入指令"。
  //   ★2026-08-15 UI 按 pitch 系统重构：指令卡内按 长线/短线 分组展示（L2 两条决策流清晰分离）。
  // ★2026-08-16 买入指令默认折叠：仅标题行可见，主动点击展开；grid-rows 动画 + busy 锁防重复触发
  var buyOrderOpen = false, buyOrderBusy = false;
  function toggleBuyOrder() {
    if (buyOrderBusy) return;                     // 动画中忽略重复点击
    buyOrderBusy = true;
    buyOrderOpen = !buyOrderOpen;
    var col = document.getElementById('buy-order-collapse');
    var st = document.getElementById('buy-order-state');
    var chev = document.getElementById('buy-order-chev');
    if (col) col.style.gridTemplateRows = buyOrderOpen ? '1fr' : '0fr';
    if (chev) chev.innerHTML = buyOrderOpen ? '▲' : '▼';
    if (st) st.textContent = buyOrderOpen ? '展开中…' : '折叠中…';
    setTimeout(function () {                      // 与 transition .28s 对齐解锁
      buyOrderBusy = false;
      if (st) st.textContent = buyOrderOpen ? '点击折叠' : '已折叠 · 点击展开';
    }, 300);
  }
  var buyOrderHead = document.getElementById('buy-order-head');
  if (buyOrderHead) buyOrderHead.addEventListener('click', toggleBuyOrder);

  function loadBuyOrder() {
    var box = document.getElementById('buy-order-box');
    if (!box) return;
    Promise.all([
      LW.api.get('/api/pitch_v2'),
      LW.api.get('/api/live/tech'),
      LW.api.get('/api/live/timing_dash')
    ]).then(function (rs) {
      var long = (rs[0] && rs[0].pitch) || [];
      var short = (rs[1] && rs[1].entries) || [];
      var tm = (rs[2] && rs[2].timing) || {};
      var level = tm.level || '';
      var isDefensive = String(level).indexOf('适合') < 0 && String(level).indexOf('上行') < 0;
      // 聚合（长线优先，去重）——与各 Tab 卡片同一批候选
      var seen = {}, cands = [];
      long.forEach(function (o) { if (!seen[o.code]) { seen[o.code] = 1; cands.push({ code: o.code, name: o.name, otype: o.otype_name || o.otype, score: o.score, isShort: false }); } });
      short.forEach(function (o) { if (!seen[o.code]) { seen[o.code] = 1; cands.push({ code: o.code, name: o.name, otype: o.otype_name || o.otype, score: o.score, isShort: true }); } });
      var tag = document.getElementById('buy-order-tag');
      if (tag) tag.textContent = 'Pitch 长+' + (short.length ? '短' : '') + '候选 ' + cands.length + ' 只 · 与下方卡片同源 · T+1 次日开盘执行';
      var body = document.getElementById('buy-order-body');
      if (isDefensive || !cands.length) {
        box.style.display = '';
        body.innerHTML = '<div class="mini" style="line-height:1.9">' +
          (isDefensive ? '<b style="color:var(--gold)">当前择时 ' + R._f(level) + '（' + R._f(tm.score, '—') + ' 分）→ 防守档，不生成买入指令</b> —— 仓位由择时总闸控制，Pitch 卡片仅供观察。'
            : '暂无 Pitch 候选（收盘后 17:35/18:30 自动生成）') + '</div>';
        return;
      }
      function rowHtml(x) {
        var done = LW.decide._done[x.code];
        var st = done === 'buy' ? '<span class="st-done st-buy">已买入</span>' :
                done === 'drop' ? '<span class="st-done st-drop">已放弃</span>' :
                '<span class="mini" style="color:#ffd76a;font-weight:700;text-shadow:0 0 10px rgba(242,201,76,.35)">待审批</span>';
        var scoreTxt = x.score != null ? (+x.score).toFixed(1) : '—';
        return '<div class="sq-factor" style="background:#1a1a20;border:1px solid rgba(255,255,255,.1)">' +
          '<span style="font-family:ui-monospace,Consolas,monospace;font-size:12px;font-weight:700;color:#ffffff;min-width:86px">' + x.code + '</span>' +
          '<b style="font-size:13px;min-width:64px;color:#f4f4f5">' + R._f(x.name, '—') + '</b>' +
          '<span class="tag-ot" style="background:rgba(139,156,246,.18);color:#aab6fa">' + (x.isShort ? '短线 · ' : '') + R._f(x.otype, '—') + '</span>' +
          '<span class="mini" style="color:#c9c9d2">评分 <b style="color:#ffffff">' + scoreTxt + '</b></span>' + st +
          '<span style="margin-left:auto;display:flex;gap:6px;align-items:center">' + actionHtml(x.code, x.name, x.otype) + '</span></div>';
      }
      function section(title, list, color) {
        if (!list.length) return '';
        var pend = list.filter(function (x) { return LW.decide._done[x.code] == null; }).length;
        return '<div style="margin:12px 0 6px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:' + color + '">' +
          '<span style="width:3px;height:14px;border-radius:2px;background:' + color + '"></span>' +
          title + ' <span style="color:var(--muted);font-weight:400">' + list.length + ' 只 · 待审批 ' + pend + '</span></div>' +
          list.map(rowHtml).join('');
      }
      var longC = cands.filter(function (x) { return !x.isShort; });
      var shortC = cands.filter(function (x) { return x.isShort; });
      box.style.display = '';
      body.innerHTML =
        '<div class="mini" style="margin-bottom:8px;line-height:1.9;color:#a1a1aa">' +
          '择时档位 <b style="color:' + (isDefensive ? 'var(--gold)' : 'var(--green)') + '">' + R._f(level) + '（' + R._f(tm.score, '—') + ' 分）</b>' +
          ' · 买入/放弃与下方卡片联动 · 一字涨停自动跳过 · 以开盘实际价成交</div>' +
        section('📈 Pitch 长线（价值/质量/重估）', longC, 'var(--navy)') +
        section('⚡ Pitch 短线（情绪/事件）', shortC, 'var(--gold)') +
        (!longC.length && !shortC.length ? '<div class="mini">暂无候选</div>' : '');
      // ★审批联动：卡片/指令任意一方审批 → 双方同步（decide.on 触发重渲染）
    }).catch(function () {
      box.style.display = 'none';
    });
  }
  loadBuyOrder();

  // ★2026-08-15 当前持仓状态条（决策→持仓衔接）：/api/live/holdings 的 _held + max_positions
  function loadHoldingsStrip() {
    var box = document.getElementById('holdings-strip');
    if (!box) return;
    LW.api.get('/api/live/holdings').then(function (d) {
      var pf = d.portfolio || {};
      var held = (pf._held && pf._held.length) ? pf._held
               : (pf.positions || []).filter(function (p) { return p.status === 'holding'; });
      var maxP = pf.max_positions || 5;
      var over = pf._over && pf._over.length ? pf._over.length : 0;
      var tag = document.getElementById('holdings-strip-tag');
      if (tag) tag.textContent = held.length + '/' + maxP + ' 只' + (over ? ' · 超限 ' + over + ' 只待处理' : '') + ' · 审批前先看剩余名额（持股≤5 纪律）';
      var body = document.getElementById('holdings-strip-body');
      if (!held.length) {
        body.innerHTML = '<div class="mini" style="opacity:.6">当前空仓 —— 可审批买入（≤' + maxP + ' 只）</div>';
      } else {
        var chips = held.map(function (p) {
          var ret = p.ret != null ? (p.ret >= 0 ? '+' : '') + (p.ret * 100).toFixed(1) + '%' : '—';
          return '<span style="display:inline-flex;align-items:center;gap:6px;background:#16161a;border:1px solid #2a2a30;border-radius:8px;padding:5px 11px;font-size:12px">' +
            '<b style="color:var(--navy)">' + R._f(p.code) + '</b> ' + R._f(p.name || '').slice(0, 6) +
            '<span style="color:' + (ret[0] === '+' ? '#eb5757' : ret[0] === '-' ? '#27ae60' : '#a1a1aa') + ';font-weight:600">' + ret + '</span></span>';
        }).join('');
        body.innerHTML = '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px">' + chips +
          '<a href="/holdings" style="margin-left:2px;color:var(--navy2);font-size:12px">持仓明细 →</a></div>';
      }
      box.style.display = '';
    }).catch(function () { /* 降级：隐藏持仓条 */ });
  }
  loadHoldingsStrip();
  // ★P0-1 审批联动：任意 buy/drop/undo（含卡片侧）→ 指令卡同步刷新；_done 预填完成后也刷新一次
  LW.decide.on(function () { loadBuyOrder(); loadHoldingsStrip(); });

  // ★2026-08-14 数据日状态条：拉 portal_dash 的 data_semantic 展示"数据流通到哪天 + 何时更新"
  //   （盘中 = 上一交易日数据属正常；用户不再误判"昨天 pitch = 卡住"）
  function loadDataDayBar() {
    LW.api.get('/api/live/portal_dash').then(function (d) {
      var bar = document.getElementById('data-day-bar');
      if (!bar) return;
      var sem = d.data_semantic || '';
      var dd = d.data_date || (d.brief && d.brief.date) || '';
      var color = sem.indexOf('已更新') >= 0 ? 'var(--green)' : (sem.indexOf('盘') >= 0 ? 'var(--navy2)' : 'var(--gold)');
      var hot = sem.indexOf('已更新') >= 0 ? '数据已更新到最新' : (sem.indexOf('盘') >= 0 ? '盘中实时行情已就绪' : '等待收盘后更新');
      bar.style.display = 'block';
      bar.innerHTML = '<b style="color:var(--navy)">数据流通状态：</b>' +
        '<span style="color:' + color + ';font-weight:600">' + (sem || ('最新完整交易日 ' + dd)) + '</span>' +
        '<span style="opacity:.75;margin-left:8px">' + hot + ' · Pitch 卡片日期为入池所用数据日，盘中显示上一交易日为正常机制</span>';
    }).catch(function () { /* 降级：隐藏状态条 */ });
  }
  loadDataDayBar();

  // #290 审批动作区（V7d 状态化：未决策=买入/放弃；已决策=状态标记+撤回）
  function actionHtml(code, name, otype) {
    var nm = String(name || '').replace(/'/g, '');
    var ot = String(otype || '');
    var done = LW.decide._done[code];
    if (done === 'buy') {
      return '<span class="st-done st-buy">已买入</span>' +
        '<button class="v2-btn neg v2-btn-undo" data-code="' + code + '" data-name="' + nm + '" data-otype="' + ot + '">撤回</button>';
    }
    if (done === 'drop') {
      return '<span class="st-done st-drop">已放弃</span>' +
        '<button class="v2-btn neg v2-btn-undo" data-code="' + code + '" data-name="' + nm + '" data-otype="' + ot + '">撤回</button>';
    }
    return '<button class="v2-btn v2-btn-buy" data-code="' + code + '" data-name="' + nm + '" data-otype="' + ot + '">买入</button>' +
      '<button class="v2-btn neg v2-btn-drop" data-code="' + code + '" data-name="' + nm + '" data-otype="' + ot + '">放弃</button>';
  }

  /* ── ★#310 Pitch 卡片渲染（恢复信息完整度：止损/胜率/证据/风控——数据在 API 全在，前端曾阉割） ── */
  function pvPct(v, d) { return (v == null || isNaN(v)) ? '—' : (v * 100).toFixed(d || 0) + '%'; }
  function riskBadge(level) {
    if (!level) return '<span class="pv-badge">风控未挂载</span>';
    if (level === 'PASS') return '<span class="pv-badge pv-pass">风控 PASS</span>';
    if (level === 'WATCH') return '<span class="pv-badge pv-watch">WATCH 复核</span>';
    if (level === 'BLOCK') return '<span class="pv-badge pv-block">BLOCK 否决</span>';
    return '<span class="pv-badge">风控 ' + level + '</span>';
  }
  function stopPlanHtml(sp) {
    sp = sp || {};
    if (sp.desc) {   // 长线格式（pitch_v2 _type_stop）
      return '<div class="pv-stop"><div class="pv-stop-t">止损方案</div>' +
        '<div class="pv-stop-d">' + R._f(sp.desc) + '</div>' +
        '<div class="pv-stop-m">' +
          (sp.stop_loss_pct != null ? '硬止损 <b>' + (sp.stop_loss_pct * 100).toFixed(0) + '%</b>' : '触发条件驱动') +
          (sp.time_stop_weeks ? ' · 时间止损 ' + sp.time_stop_weeks + ' 周' : '') +
          (sp.trailing_ma ? ' · 移动 MA' + sp.trailing_ma : '') + '</div>' +
        ((sp.logic_fail_rules || []).map(function (r) { return '<div class="pv-stop-f">' + r.name + '：' + r.rule + '（' + r.action + '）</div>'; }).join('')) + '</div>';
    } else if (sp.atr_stop != null || sp.stop_loss_pct != null) {   // 短线格式（tech_pitch_v3）
      return '<div class="pv-stop"><div class="pv-stop-t">止损方案（短线）</div>' +
        '<div class="pv-stop-d">ATR20 双倍线止损' + (sp.atr_stop != null ? '，现价下方 <b>' + sp.atr_stop + '</b> 为执行位（跌破即走）' : '') + '</div>' +
        '<div class="pv-stop-m">' + (sp.stop_loss_pct != null ? '硬止损 <b>' + (sp.stop_loss_pct * 100).toFixed(0) + '%</b>' : '') +
          (sp.trailing_ma ? ' · 移动 MA' + sp.trailing_ma : '') + '</div></div>';
    }
    return '';
  }
  function pitchCard(o, latest) {
    var h = o.horizons || {};
    var hasH = ['1y', '2y', '3y'].some(function (y) { return h[y] && h[y].n; });
    // ★2026-08-14 数据日徽章语义：pitch_date == 最新完整交易日 → "最新"绿色；否则金色滞后提示
    //   （盘中 pitch 用上一交易日数据是正常机制，卡片明确标注避免误判"数据卡住"）
    var dateBadge = '';
    if (o.pitch_date) {
      var isLatest = latest && o.pitch_date >= latest;
      dateBadge = '<span class="pv-badge pv-date">Pitch ' + R._f(o.pitch_date) +
        (isLatest ? ' <b style="color:var(--green)">最新</b>' : (latest ? ' <b style="color:var(--gold)">早于数据日</b>' : '')) + '</span>';
    }
    var badges = [
      dateBadge,
      // ★P0-2 单因子依赖警示：仅 1 个因子/单一类型命中 → 橙徽章（单因子极值易踩尾样本，需主观复核）
      (function () {
        var nFac = Object.keys(o.factors || {}).length;
        var singleDep = (o.n_types_hit != null && o.n_types_hit <= 1) || (nFac > 0 && nFac <= 1);
        if (!singleDep) return '';
        return '<span class="pv-badge" style="background:rgba(242,201,76,.12);color:#f2c94c" title="仅 ' +
          (nFac > 0 ? nFac + ' 个因子' : '单一类型') + '支撑，存在单因子依赖风险——需主观复核基本面，勿直接照单全收">单因子依赖</span>';
      })(),
      // ★2026-08-14 顶级买点标签（择时高概率+高稀有度+强买入，极其严格——scan 四条件全满足才打标）
      o.top_buy ? '<span class="pv-badge" style="background:linear-gradient(135deg,#f2c94c,#eb5757);color:#ffffff;font-weight:700;letter-spacing:.5px" title="' + R._f(o.top_buy_note) + '">★ 顶级买点</span>' : '',
      '<span class="pv-badge ' + R.otypeClass(o.otype) + '">' + R._f(o.otype_name || o.otype) + '</span>',
      // ★2026-08-14 Pitch 改进规格 v2 ⑤：实证徽章（17 年 6 月胜率/均收益——quality_gap 🏆70.4%/+14.6% …）
      //   T1 实证强=绿、T2 中游=蓝、T3 环境敏感=金、负期望=红——用户一眼分清"实证强"vs"弹性"
      o.pitch_badge ? '<span class="pv-badge" style="' +
        (o.pitch_badge_tier && o.pitch_badge_tier.indexOf('T1') >= 0 ? 'background:rgba(39,174,96,.12);color:#4ade80' :
         o.pitch_badge_tier && o.pitch_badge_tier.indexOf('T3') >= 0 ? 'background:rgba(242,201,76,.12);color:#f2c94c' :

      var list = Array.isArray(d) ? d : ((d && d.decisions) || []);
      var rows = list.slice(0, 40).map(function (r) {
        var act = r.action === 'buy' ? '<span class="st-done st-buy">买入</span>' : (r.action === 'drop' ? '<span class="st-done st-drop">放弃</span>' : '');
        return '<div class="opp-row"><span class="code">' + R._f(r.code) + '</span>' + act +
          '<span class="nm">' + R._f(r.date) + '</span>' +
          '<span class="mini" style="flex:1">' + R._f(r.note, '').slice(0, 30) + '</span>' +
          (r.env_level ? '<span class="mini" style="color:#a1a1aa">环境 ' + R._f(r.env_level) + ' ' + R._f(r.env_score, '') + '</span>' : '') + '</div>';
      }).join('');
      box.innerHTML = '<div class="v2-card" style="margin-top:0"><h2> 决策记录 <span class="tag">' + list.length + ' 条 · 环境留痕 · 复盘参考</span></h2>' +
        '<div style="max-height:560px;overflow-y:auto;border:1px solid #26262c;border-radius:8px;padding:4px 6px">' +
        (rows || '<div class="mini">暂无决策记录</div>') + '</div>' +
        '<div class="mini" style="margin-top:8px">远期池 T+1/5/20/60 实战验证见 <a href="/holdings#forward" style="color:var(--navy2)">持仓页 · 远期验证</a></div></div>';
    }).catch(function (e) { box.innerHTML = ' ' + e; });
  }

  /* ★2026-08-16 ETF 映射 Tab：与 Pitch 长线/短线同级（配置表达层，内嵌 /etf?embed=1）
     ★2026-08-16 排版优化：同源 iframe 高度自适应（数据加载后按内容撑开，无空白） */
  function loadEtfMap(box) {
    box.innerHTML =
      '<div class="mini" style="margin-bottom:8px;line-height:1.8;color:#a1a1aa">' +
      '<b style="color:var(--navy2)">ETF 映射（配置表达层）</b> —— 策略暴露（turn_low 等）与候选 ETF 的相关性检验、ETF Pitch 卡与小资金配置建议；' +
      '<span style="color:var(--muted)">非买入指令来源，买入指令 = 上方今日买入指令（L2 卡片同源）。</span></div>' +
      '<iframe id="etf-frame" src="/etf?embed=1" style="width:100%;height:74vh;border:1px solid #2a2a30;border-radius:10px;background:#0f0f12;display:block"></iframe>';
    var fr = document.getElementById('etf-frame');
    if (fr) {
      var fit = function () {
        try {
          var doc = fr.contentDocument || fr.contentWindow.document;
          var h = doc.body.scrollHeight;
          if (h > 200) fr.style.height = h + 'px';
        } catch (e) {}
      };
      fr.addEventListener('load', function () {
        setTimeout(fit, 400);
        setTimeout(fit, 1500);
      });
    }
  }

  /* ★2026-08-15 Tab 结构 = pitch 系统分层（L0/L2/L1）：
     择时（L0 仓位总闸）｜ Pitch 长线（L2 价值线）｜ Pitch 短线（L2 情绪线，独立可见不再被埋）
     ｜ 参考（L1 因子参考/机会池/机器池/竞价）｜ 历史（决策记录）
     ★板块研究不再占 Tab：入口在「参考 · L1」头部（圈方向 · 板块研究台），主观量化已并入长线 pitch 流 */
  var tabsApi = LW.tabs.init('tabs-demo', [
    { id: 'long', label: 'Pitch 长线', load: loadPitchLong },
    { id: 'short', label: 'Pitch 短线', load: loadPitchShort },
    { id: 'etf', label: 'ETF 映射', load: loadEtfMap },
    { id: 'ref', label: '参考 · L1', load: loadReference },
    { id: 'history', label: '历史', load: loadHistory }
  ]);
  // #290 审批事件委托（buy/drop/undo 点击  LW.decide.approve）
  LW.decide.bind(document.getElementById('tabs-demo'));
  // ★P0-1 顶部指令卡审批按钮同样走事件委托（与卡片同源联动）
  LW.decide.bind(document.getElementById('buy-order-box'));
  // V7d 审批后即时刷新：buy/drop/undo 后重载当前 Tab（卡片状态即时更新）
  LW.decide.on(function () { tabsApi.reload(); });
  // ★#360 回到页面时刷新（visibilitychange）——用户切回标签页自动拉最新，替代盲目的定时轮询
  //   （决策页有审批操作，定时轮询会重建卡片 DOM 干扰审批，切回刷新则无此风险）
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { tabsApi.reload(); }
  });
})();
</script>
